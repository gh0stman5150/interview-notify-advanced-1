[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-notify"
version = "1.5.0"
description = "Push notifications from IRC logs for private tracker interviews"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
interview-notify = "interview_notify:main"
interview-notify-stats = "view_stats:main"

[project.gui-scripts]
interview-notify-gui = "interview_notify_gui:main"

[tool.setuptools]
py-modules = [
    "interview_database",
    "interview_modes",
    "interview_notify",
    "interview_notify_gui",
    "view_stats",
]

[tool.setuptools.packages.find]
include = ["file_read_backwards*"]